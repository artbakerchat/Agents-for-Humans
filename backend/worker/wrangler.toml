name = "agents-for-humans-api"
main = "src/index.ts"
compatibility_date = "2026-09-02"

[vars]
# Set this to the deployed API Gateway URL.
API_GATEWAY_URL = "https://replace-me.execute-api.us-east-1.amazonaws.com"
TURNSTILE_SITE_KEY = "replace-me"
SESSION_TTL_SECONDS = "3600"

[secrets]
required = ["APP_AUTH_TOKEN", "TURNSTILE_SECRET_KEY", "SESSION_SIGNING_SECRET"]
